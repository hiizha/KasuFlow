
name: Build KasuFlow IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: unzip KasuFlow-iOS-Source.zip -d source

      - name: Build iOS app
        run: |
          xcodebuild \
            -project source/KasuFlow/KasuFlow.xcodeproj \
            -scheme KasuFlow \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KasuFlow.app Payload/
          zip -r KasuFlow-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KasuFlow-unsigned-IPA
          path: KasuFlow-unsigned.ipa
          retention-days: 7
